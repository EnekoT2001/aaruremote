name: Windows - Release builds (aaruremote) - x64 & x86 (fixed)

on:
  push:
    branches: [ "devel", "main" ]
  pull_request:
    branches: [ "devel", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, Win32 ]
    defaults:
      run:
        shell: pwsh

    env:
      CMAKE_GENERATOR: 'Visual Studio 17 2022'
      CMAKE_INSTALL_PREFIX: "$Env:USERPROFILE\\aaruremote"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (optional)
        run: choco install -y ninja || true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27'

      - name: Configure (Visual Studio generator)
        run: |
          # Put the matrix value into a quoted PowerShell string so it is not treated as a command token.
          $arch = "${{ matrix.arch }}"
          Write-Host "Configuring for architecture: $arch"
          cmake -S . -B build -G "${{ env.CMAKE_GENERATOR }}" -A "$arch" -DCMAKE_INSTALL_PREFIX="$Env:CMAKE_INSTALL_PREFIX" -DCMAKE_BUILD_TYPE=Release
        shell: pwsh

      - name: Build (Release)
        run: cmake --build build --config Release -- /m
        shell: pwsh

      - name: Locate built executable and stage package
        run: |
          # Quote the matrix expansion again before using it in conditions.
          $arch = "${{ matrix.arch }}"
          if ($arch -eq 'Win32') { $archShort = 'x86' } else { $archShort = 'x64' }

          Write-Host "Looking for .exe in build/ for arch $arch (artifact short name: $archShort)"

          $exePath = "build\\Release\\aaruremote.exe"

          if (-Not (Test-Path $exePath)) {
            Write-Error "Expected aaruremote.exe not found at $exePath"
            exit 1
          }
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item $exePath package\
          $zipName = "aaruremote-windows-${archShort}-release.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path package\* -DestinationPath $zipName -Force
          Write-Host "Created artifact zip: $zipName"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaruremote-windows-${{ matrix.arch }}-release
          path: |
            aaruremote-windows-*-release.zip
          retention-days: 7
